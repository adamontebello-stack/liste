<script>
/* =========================================================================
   Scelta automatica della versione: mobile (barra in basso, schede grandi)
   oppure desktop (sidebar verticale, griglia). Si può forzare con ?ui=mobile
   o ?ui=desktop nell'URL, oppure dalle Impostazioni (voce "Interfaccia").
   ========================================================================= */
(function(){
  var forced = null;
  try { forced = localStorage.getItem('st_uiShell'); } catch(e){}
  var param = null;
  try { param = new URLSearchParams(location.search).get('ui'); } catch(e){}
  var shell;
  if(param === 'mobile' || param === 'desktop'){
    shell = param;
  } else if(forced === 'mobile' || forced === 'desktop'){
    shell = forced;
  } else {
    var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    var w = window.innerWidth || document.documentElement.clientWidth || 1024;
    shell = (w <= 760 || (coarse && w <= 1024)) ? 'mobile' : 'desktop';
  }
  window.ST_SHELL = shell;
  document.documentElement.setAttribute('data-shell', shell);
})();
</script>

body.ui-desktop .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1 1 auto;
}
body.ui-desktop .form-group label {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.09em;
  font-weight: 700;
}
body.ui-desktop .form-group input, body.ui-desktop .form-group select {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 11px 13px;
  border-radius: 13px;
  outline: none;
  font-family: 'sans-serif', sans-serif;
  font-size: 0.88rem;
  font-weight: 500;
  transition: border-color 0.2s, box-shadow 0.2s;
}
body.ui-desktop .form-group input:focus, body.ui-desktop .form-group select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accentGlow), 0 0 14px var(--accentGlow);
}
body.ui-desktop .btn {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none; color: white;
  padding: 11px 20px;
  border-radius: 13px;
  cursor: pointer;
  font-family: 'sans-serif', sans-serif;
  font-weight: 700; font-size: 0.85rem;
  transition: all 0.22s cubic-bezier(0.34,1.4,0.64,1);
  box-shadow: 0 4px 16px var(--accentGlow);
  position: relative; overflow: hidden;
}
body.ui-desktop .btn::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
  opacity: 0; transition: opacity 0.2s;
}
body.ui-desktop .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px var(--accentGlow);
}
body.ui-desktop .btn:hover::after { opacity: 1;
}
body.ui-desktop .btn:active { transform: translateY(0);
}
body.ui-desktop .btn-ghost {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  box-shadow: none;
}
body.ui-desktop .btn-ghost:hover { box-shadow: none; border-color: var(--accent);
}
body.ui-desktop .btn-sm { padding: 7px 15px; font-size: 0.74rem;
}
body.ui-desktop .stats-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.3rem; justify-content: center;
}
body.ui-desktop .stat-pill {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 0.71rem;
  color: var(--muted2);
  display: flex; align-items: center; gap: 7px;
  font-weight: 600;
  transition: all 0.2s;
  cursor: default;
}
body.ui-desktop .stat-pill:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px var(--accentGlow);
}
body.ui-desktop .stat-pill strong { color: var(--text); font-weight: 800;
}
body.ui-desktop .stat-pill .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 5px var(--accent);
}
body.ui-desktop .stat-pill .dot.red { background: var(--red);   box-shadow: 0 0 5px var(--red);
}
body.ui-desktop .stat-pill .dot.green { background: var(--green); box-shadow: 0 0 5px var(--green);
}
body.ui-desktop .stat-pill .dot.blue { background: var(--blue);  box-shadow: 0 0 5px var(--blue);
}
body.ui-desktop .stat-pill .dot.amber { background: var(--amber); box-shadow: 0 0 5px var(--amber);
}
body.ui-desktop .sec-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.3rem; flex-wrap: wrap; gap: 10px;
}
body.ui-desktop .sec-title {
  font-size: 1.45rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--text);
}
body.ui-desktop .catalog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1050px; margin: 0 auto;
}
@media (max-width: 700px) {
  body.ui-desktop .catalog-grid { grid-template-columns: 1fr;
  }
}
body.ui-desktop #catalog-serie-subtab {
  display: flex;
  flex-direction: column;
  height: calc(108vh - 65px - 1.0rem - 2rem);
}
body.ui-desktop .serie-sticky-head {
  flex: 0 0 auto;
  background: transparent;
  position: sticky;
  top: 12px;
  z-index: 100;
}
body.ui-desktop .catalog-grid-scroll { align-items: stretch; flex: 1 1 auto; min-height: 0; margin-bottom: 6px; grid-template-rows: 1fr;
}
body.ui-desktop .catalog-grid-scroll .column {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  width: 515px;
}
body.ui-desktop .catalog-grid-scroll .column .list {
  overflow-y: auto;
  scrollbar-width:none;
  flex: 1 1 auto;
  min-height: 0;
}
@media (max-width: 700px) {
  body.ui-desktop #catalog-serie-subtab { height: auto;
  }
  body.ui-desktop .catalog-grid-scroll { flex: initial; grid-template-rows: none;
  }
  body.ui-desktop .catalog-grid-scroll .column { height: auto; max-height: none;
  }
  body.ui-desktop .catalog-grid-scroll .column .list { overflow-y: visible;
  }
  body.ui-desktop .serie-sticky-head { position: static;
  }
}
body.ui-desktop .column {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.3s;
}
body.ui-desktop .column:hover { box-shadow: var(--shadow-sm), 0 0 0 1px var(--border2);
}
body.ui-desktop .column.col-dub { border-top: 2px solid var(--dub-border);
}
body.ui-desktop .column.col-sub { border-top: 2px solid var(--sub-border);
}
body.ui-desktop .column-header {
  padding: 1rem 1.3rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex: 0 0 auto;
}
body.ui-desktop .column-title { display: flex; align-items: center; gap: 9px;
}
body.ui-desktop .column-title h3 { font-size: 0.88rem; font-weight: 800; letter-spacing: -0.02em;
}
body.ui-desktop .badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  font-family: 'DM Mono', monospace;
}
body.ui-desktop .badge.dub { background: var(--dub-bg); color: var(--dub-color); border: 1px solid var(--dub-border);
}
body.ui-desktop .badge.sub { background: var(--sub-bg); color: var(--sub-color); border: 1px solid var(--sub-border);
}
body.ui-desktop .badge.dropped {
  background: rgba(120,120,120,0.12);
  color: var(--muted2);
  border: 1px solid rgba(120,120,120,0.3);
}
body.ui-desktop .count-badge {
  background: var(--surface3);
  border: 1px solid var(--border);
  padding: 3px 9px;
  border-radius: 40px;
  font-size: 0.68rem;
  font-weight: 700;
  font-family: 'DM Mono', monospace;
}
body.ui-desktop .list { padding: 4px 0;
}
body.ui-desktop .item {
  display: flex; align-items: center; gap: 12px;
  padding: 15px 1.8rem;
  border-bottom: 1px solid rgba(128,128,128,0.05);
  transition: background 0.15s;
}
body.ui-desktop .item:hover { background: var(--card-hover);
}
body.ui-desktop .item-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem; color: var(--muted2);
  width: 22px; text-align: right;
}
body.ui-desktop .item-title { flex: 1; font-size: 0.84rem; font-weight: 700;
}
body.ui-desktop .item-eps {
  color: var(--muted); font-size: 0.68rem;
  font-family: 'DM Mono', monospace;
  background: var(--surface3);
  padding: 2px 8px; border-radius: 20px;
}
body.ui-desktop .item-actions { display: none; gap: 5px;
}
body.ui-desktop .item:hover .item-actions { display: flex;
}
body.ui-desktop .item-btn {
  background: var(--surface3);
  border: 1px solid var(--border);
  color: var(--muted2);
  width: 29px; height: 29px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 0.78rem;
  transition: all 0.18s cubic-bezier(0.34,1.4,0.64,1);
  display: flex; align-items: center; justify-content: center;
}
body.ui-desktop .rm-actions .item-btn {
  background: transparent;
  border: 1px solid #000;
}
body.ui-desktop .item-btn:hover {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  box-shadow: 0 4px 14px var(--accentGlow);
  transform: translateY(-2px) scale(1.07);
}
body.ui-desktop .item-btn:active { transform: translateY(0) scale(1);
}
body.ui-desktop .item-btn.danger:hover { background: var(--red); border-color: var(--red); box-shadow: 0 4px 14px rgba(255,59,92,0.5);
}
body.ui-desktop .empty {
  padding: 2.5rem;
  text-align: center;
  color: var(--muted);
  font-size: 0.8rem;
}
body.ui-desktop .empty-icon { font-size: 1.6rem; margin-bottom: 0.5rem; opacity: 0.4;
}
body.ui-desktop .roadmap, body.ui-desktop .completed-grid { display: flex; flex-direction: column; gap: 8px; max-width: 900px; margin: 0 auto;
}
body.ui-desktop .programma-layout { position: relative;
}
body.ui-desktop .roadmap-alert-col { display: none;
}
@media (min-width: 1300px) {
  body.ui-desktop .roadmap-alert-col.visible {
    display: block;
    position: fixed;
    top: 88px;
    right: 22px;
    width: 234px;
    max-height: calc(100vh - 112px);
    overflow-y: auto;
    z-index: 60;
  }
}
body.ui-desktop .programma-main { min-width: 0;
}
body.ui-desktop .rm-alert-panel {
  background: var(--surface);
  border: 1px solid rgba(255,170,51,0.3);
  border-radius: 16px;
  padding: 12px 13px;
  box-shadow: var(--shadow-sm);
}
body.ui-desktop .rm-alert-panel-title {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.62rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--amber);
  margin-bottom: 10px;
}
body.ui-desktop .rm-alert-card {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 9px 10px 9px 13px;
  background: var(--surface2);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.15s, box-shadow 0.15s;
}
body.ui-desktop .rm-alert-card + .rm-alert-card { margin-top: 8px;
}
body.ui-desktop .rm-alert-card:hover { border-color: var(--accent); background: var(--card-hover); transform: translateX(2px);
}
body.ui-desktop .rm-alert-card.linked-highlight {
  border-color: var(--amber);
  background: var(--card-hover);
  transform: translateX(2px);
  box-shadow: 0 0 0 1px rgba(255,170,51,0.45), 0 0 16px rgba(255,170,51,0.25);
}
body.ui-desktop .rm-alert-card-title {
  font-size: 0.74rem; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 5px;
}
body.ui-desktop .rm-alert-card-title .badge { font-size: 0.52rem; padding: 2px 6px; flex-shrink: 0;
}
body.ui-desktop .rm-alert-note {
  font-size: 0.66rem; color: var(--muted2);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 5px;
}
body.ui-desktop .rm-alert-films {
  display: flex; flex-direction: column; gap: 3px;
}
body.ui-desktop .rm-alert-film {
  display: flex; align-items: center; gap: 5px;
  font-size: 0.64rem; color: var(--muted2);
  font-family: 'DM Mono', monospace;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
body.ui-desktop .rm-alert-film::before { content: '🎬'; font-size: 0.6rem; flex-shrink: 0;
}
body.ui-desktop .rm-alert-films-more { font-size: 0.6rem; color: var(--muted); font-style: italic;
}
body.ui-desktop .rm-item.has-alert-link { box-shadow: inset 3px 0 0 var(--amber);
}
body.ui-desktop .rm-item.linked-highlight {
  border-color: var(--amber);
  box-shadow: inset 3px 0 0 var(--amber), 0 0 0 2px rgba(255,170,51,0.4), 0 0 18px rgba(255,170,51,0.3);
}
body.ui-desktop .rm-alert-linked-badge {
  font-size: 0.6rem;
  margin-left: 3px;
  filter: drop-shadow(0 0 4px rgba(255,170,51,0.65));
}
body.ui-desktop .rm-item, body.ui-desktop .completed-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 14px 17px;
  display: flex; align-items: center; gap: 13px;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s, transform 0.2s;
  cursor: default;
  position: relative;
  overflow: hidden;
}
body.ui-desktop .rm-backdrop {
  position: absolute; inset: 0; z-index: 0;
  background-size: cover;
  background-position: center right;
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, transparent 38%, rgba(0,0,0,0.35) 58%, rgba(0,0,0,0.8) 80%, #000 100%);
          mask-image: linear-gradient(to right, transparent 0%, transparent 38%, rgba(0,0,0,0.35) 58%, rgba(0,0,0,0.8) 80%, #000 100%);
}
body.ui-desktop .rm-backdrop.loaded { opacity: 0.4;
}
body.ui-desktop .rm-backdrop.fallback { filter: blur(3px) saturate(0.9); transform: scale(1.06);
}
body.ui-desktop .rm-backdrop.fallback.loaded { opacity: 0.24;
}
body.ui-desktop.theme-light .rm-backdrop.loaded { opacity: 0.22;
}
body.ui-desktop.theme-light .rm-backdrop.fallback.loaded { opacity: 0.14;
}
body.ui-desktop .rm-item > *:not(.rm-backdrop) { position: relative; z-index: 1;
}
body.ui-desktop #watchingBackdrop {
  /* Stile Trakt: il backdrop occupa solo la parte alta della pagina, con le
     sue proporzioni 16:9, e sfuma verso il colore scuro di fondo (--bg) che
     riempie il resto dello schermo. */
  position: fixed; top: 0; left: 0; right: 0;
  height: min(56.25vw, 75vh);
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
  filter: grayscale(1) contrast(1.08);
  opacity: 0;
  transition: opacity 0.7s ease, background-image 0.3s ease;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 38%, rgba(0,0,0,0.7) 60%, rgba(0,0,0,0.3) 82%, transparent 100%);
          mask-image: linear-gradient(to bottom, #000 0%, #000 38%, rgba(0,0,0,0.7) 60%, rgba(0,0,0,0.3) 82%, transparent 100%);
}
body.ui-desktop #watchingBackdrop.on { opacity: 0.16;
}
body.ui-desktop.theme-light #watchingBackdrop.on { opacity: 0.12;
}
body.ui-desktop .rm-item::before, body.ui-desktop .completed-item::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: transparent;
  transition: background 0.25s;
}
body.ui-desktop .rm-item:hover, body.ui-desktop .completed-item:hover {
  border-color: var(--border2);
  box-shadow: 0 6px 24px rgba(0,0,0,0.2);
  transform: translateX(2px);
}
body.ui-desktop .rm-item:hover::before { background: var(--accent);
}
body.ui-desktop .completed-item:hover::before { background: var(--green);
}
body.ui-desktop .rm-item.watching {
  background: var(--surface2);
  border-color: rgba(232,25,90,0.28);
  box-shadow: 0 0 0 1px rgba(232,25,90,0.1), 0 4px 18px rgba(232,25,90,0.08);
}
body.ui-desktop .rm-item.watching::before { background: var(--accent);
}
body.ui-desktop .rm-num, body.ui-desktop .c-num {
  font-family: 'DM Mono', monospace;
  font-weight: 500; font-size: 0.72rem;
  color: var(--muted2); min-width: 28px; opacity: 0.7;
}
body.ui-desktop .rm-info, body.ui-desktop .c-info { flex: 1; min-width: 0;
}
body.ui-desktop .rm-name, body.ui-desktop .c-title {
  font-weight: 800; font-size: 0.87rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: -0.01em;
}
body.ui-desktop .rm-meta, body.ui-desktop .c-meta {
  font-size: 0.66rem; color: var(--muted2);
  margin-top: 2px;
  font-family: 'DM Mono', monospace;
}
body.ui-desktop .progress-bottom {
  position: absolute;
  left: 3px; right: 0; bottom: 0;
  height: 3px;
  background: var(--surface3);
  pointer-events: none;
  z-index: 1;
}
body.ui-desktop .progress-bottom-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width 0.4s cubic-bezier(0.34,1.2,0.64,1);
  box-shadow: 0 0 6px var(--accentGlow);
}
body.ui-desktop .ep-input {
  background: transparent;
  border: none;
  color: var(--text); width: 3ch;
  padding: 0; border-radius: 0;
  font-family: 'DM Mono', monospace; text-align: right;
  font-size: 0.8rem; font-weight: 800; line-height: 1;
  transition: color 0.2s;
  -moz-appearance: textfield;
}
body.ui-desktop .ep-input::-webkit-outer-spin-button, body.ui-desktop .ep-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0;
}
body.ui-desktop .ep-input:focus { color: var(--accent2); outline: none;
}
body.ui-desktop .ep-total {
  font-family: 'DM Mono', monospace;
  font-size: 0.8rem; font-weight: 600;
  color: var(--muted2); line-height: 1;
  width: 4ch; text-align: left;
}
body.ui-desktop .ep-count {
  display: flex; align-items: center; justify-content: center;
  gap: 1px;
  min-width: 62px;
  padding: 0 2px;
}
body.ui-desktop .ep-pct {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem; font-weight: 800;
  color: var(--accent2);
  line-height: 1;
  min-width: 42px;
  text-align: center;
  padding: 0 8px 0 9px;
  border-left: 1px solid var(--border2);
  white-space: nowrap;
  flex-shrink: 0;
}
body.ui-desktop .rm-actions { display: flex; gap: 6px; opacity: 1;
}
body.ui-desktop .c-actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.15s;
}
body.ui-desktop .completed-item:hover .c-actions { opacity: 1;
}
body.ui-desktop .watching-tag {
  font-size: 0.57rem; font-weight: 700;
  color: var(--accent2);
  background: rgba(232,25,90,0.12);
  border: 1px solid rgba(232,25,90,0.25);
  padding: 3px 9px; border-radius: 30px;
  letter-spacing: 0.07em; text-transform: uppercase;
  animation: watchPulse 2s ease-in-out infinite;
}
@keyframes watchPulse {
  0%,100% { box-shadow: 0 0 0px var(--accentGlow); }
  50%      { box-shadow: 0 0 8px var(--accentGlow); }

body.ui-desktop .type-toggle-badge { cursor: pointer; transition: filter 0.15s, transform 0.15s; user-select: none;
}
body.ui-desktop .type-toggle-badge:hover { filter: brightness(1.25); transform: translateY(-1px);
}
body.ui-desktop .type-toggle-icon { opacity: 0.55; margin-left: 4px; font-size: 0.85em;
}
body.ui-desktop .rm-detail-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 2px;
}
body.ui-desktop .rm-detail-action {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 11px 14px; border-radius: 12px;
  font-size: 0.82rem; font-weight: 700; cursor: pointer;
  transition: all 0.18s cubic-bezier(0.34,1.4,0.64,1);
  text-align: left; width: 100%;

body.ui-desktop .rm-detail-action .rda-icon { font-size: 0.95em; width: 1.2em; text-align: center; flex-shrink: 0;
}
body.ui-desktop .rm-detail-action:hover { border-color: var(--border2); background: var(--card-hover); transform: translateX(2px);
}
body.ui-desktop .rm-detail-action.active { border-color: var(--accent); background: var(--accentGlow2); color: var(--accent2); box-shadow: 0 0 0 1px var(--accentGlow);
}
body.ui-desktop .rm-detail-action.danger { color: var(--red);
}
body.ui-desktop .rm-detail-action.danger:hover { border-color: var(--red); background: rgba(255,59,74,0.08);
}
body.ui-desktop .ongoing-tag {
  font-size: 0.57rem; font-weight: 700;
  color: var(--green);
  background: rgba(46,232,165,0.12);
  border: 1px solid rgba(46,232,165,0.28);
  padding: 3px 9px; border-radius: 30px;
  letter-spacing: 0.07em; text-transform: uppercase;
  flex-shrink: 0;
  animation: ongoingPulse 2.5s ease-in-out infinite;

  0%,100% { box-shadow: 0 0 0px rgba(46,232,165,0.3); }

body.ui-desktop .film-tag {
  font-size: 0.57rem; font-weight: 700;
  color: var(--blue);
  background: rgba(45,158,255,0.12);
  border: 1px solid rgba(45,158,255,0.28);
  padding: 3px 9px; border-radius: 30px;
  letter-spacing: 0.05em; font-family: 'DM Mono', monospace;
  flex-shrink: 0;
}
body.ui-desktop .item-notes {
  font-size: 0.66rem;
  color: var(--muted2);
  font-family: 'DM Mono', monospace;
  margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 100%;
  opacity: 0.8;
}
body.ui-desktop .item-info { flex: 1; min-width: 0; display: flex; flex-direction: column;
}
body.ui-desktop .catalog-view-toggle { display: flex; gap: 6px;
}

body.ui-desktop #catalogSearchRow.filters-hidden .search-input, body.ui-desktop #catalogSearchRow.filters-hidden .ep-filter-row {
  display: none;
}
body.ui-desktop #catalog-serie-subtab.cards-mode { height: auto;
}
body.ui-desktop #catalog-serie-subtab.cards-mode .catalog-grid-scroll { display: none !important;
}
body.ui-desktop .series-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
  gap: 16px;
  padding: 4px 2px 18px;
}
@media (max-width: 700px) {
  body.ui-desktop .series-cards-grid { grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
  }
}
body.ui-desktop .saga-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, 172px);
  justify-content: center;
  gap: 16px;
  padding: 4px 2px 18px;
}
@media (max-width: 700px) {
  body.ui-desktop .saga-cards-grid { grid-template-columns: repeat(auto-fit, 138px);
  }
}
body.ui-desktop .series-card {
  position: relative;
  display: flex;
  flex-direction: column;
  border-radius: 16px;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  cursor: default;
  transition: transform 0.22s cubic-bezier(0.34,1.4,0.64,1), box-shadow 0.22s;
}
body.ui-desktop .series-card:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 10px 26px rgba(0,0,0,0.35), 0 0 0 1px var(--border2);
  z-index: 2;
}
body.ui-desktop .series-card.is-ongoing {
  animation: cardOngoingAura 1.8s ease-in-out infinite;
  will-change: box-shadow;
}
@keyframes cardOngoingAura {
  /* Ridotto il blur (era 26px) e rimossa l'animazione di border-color: un box-shadow
     con blur ampio ridisegnato ad ogni frame su molte card contemporaneamente è
     una delle animazioni CSS più costose per il browser e causava il lag nel catalogo. */
  0%,100% { box-shadow: 0 0 0 1px rgba(46,232,165,0.35), 0 0 6px 1px rgba(46,232,165,0.25); }
  50%      { box-shadow: 0 0 0 2px #2ee8a5, 0 0 10px 2px rgba(46,232,165,0.55); }
}
body.ui-desktop .series-card-poster-wrap {
  position: relative;
  width: 100%;
  height: 0;
  padding-bottom: 138%; /* poster più alto */
  flex: 0 0 auto;
  background: linear-gradient(135deg, var(--surface2), var(--surface3));
  overflow: hidden;
}
body.ui-desktop .series-card-poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
}
body.ui-desktop .series-card-noimg {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; color: var(--muted); opacity: 0.5;
}
body.ui-desktop .series-card-poster-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.7);
  opacity: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  transition: opacity 0.2s ease;
  pointer-events: none;
  z-index: 3;
}
body.ui-desktop .series-card-poster-wrap:hover .series-card-poster-overlay {
  opacity: 1;
  pointer-events: auto;
}
body.ui-desktop .series-card-overlay-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  background: rgba(255,255,255,0.1);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  color: #fff;
  font-size: 1.05rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(0.34,1.4,0.64,1), background 0.18s, border-color 0.18s;
}
body.ui-desktop .series-card-overlay-btn:hover {
  transform: scale(1.14);
  background: var(--accent);
  border-color: var(--accent);
}
body.ui-desktop .series-card-corner {
  position: absolute; top: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 0.55rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  font-family: 'DM Mono', monospace;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  text-transform: uppercase;
  /* sopra l'overlay scuro (z-index 3) così i tag restano leggibili anche in hover */
  z-index: 4;
  color: #fff;
  cursor: default;
}
body.ui-desktop .series-card-corner.tag-ongoing { left: 8px; background: rgba(46,232,165,0.35); border: 1px solid rgba(46,232,165,0.5);
}
body.ui-desktop .series-card-corner.tag-film { right: 8px; background: rgba(45,158,255,0.35); border: 1px solid rgba(45,158,255,0.5); cursor: help;
}
body.ui-desktop .series-card-corner.tag-order { right: 8px; background: rgba(255,255,255,0.16); border: 1px solid var(--border2);
}
body.ui-desktop .series-card-corner.tag-type { left: 8px;
}
body.ui-desktop .series-card-corner.tag-type.dub { background: rgba(255,94,122,0.4); border: 1px solid rgba(255,94,122,0.55);
}
body.ui-desktop .series-card-corner.tag-type.sub { background: rgba(74,199,255,0.4); border: 1px solid rgba(74,199,255,0.55);
}
body.ui-desktop .series-card-corner.tag-note {
  top: auto; bottom: 8px; right: 8px;
  background: rgba(255,204,51,0.35); border: 1px solid rgba(255,204,51,0.5);
  font-size: 0.72rem; padding: 3px 7px; cursor: help;
}
body.ui-desktop .series-card-bottom {
  flex: 1 1 auto;
  min-height: 0;
  padding: 9px 11px 10px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  background: var(--surface);
  cursor: pointer;
}
body.ui-desktop .series-card-title {
  font-size: 0.82rem;
  font-weight: 575;
  line-height: 1;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
body.ui-desktop .series-card-tagrow { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; flex-wrap: wrap;
}
body.ui-desktop .series-card-type-badge {
  font-size: 0.56rem; font-weight: 800;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 20px;
}
body.ui-desktop .series-card-type-badge.dub { background: var(--dub-bg); color: var(--dub-color); border: 1px solid var(--dub-border);
}
body.ui-desktop .series-card-type-badge.sub { background: var(--sub-bg); color: var(--sub-color); border: 1px solid var(--sub-border);
}
body.ui-desktop .series-card-note-badge {
  font-size: 0.68rem; line-height: 1; cursor: help;
  color: var(--amber); opacity: 0.9;
}
body.ui-desktop .series-card-note-tag {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 0.55rem; font-weight: 800;

  letter-spacing: 0.05em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 8px;
  color: #fff;
  background: rgba(255,204,51,0.35);
  border: 1px solid rgba(255,204,51,0.5);
  cursor: help;
  flex-shrink: 0;
}
body.ui-desktop .series-card-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex: 0 0 auto;
}
body.ui-desktop .series-card-eps {
  color: var(--muted); font-size: 0.66rem;
  font-family: 'DM Mono', monospace;
  background: var(--surface3);
  padding: 3px 9px; border-radius: 20px;
}
body.ui-desktop .series-card-fav {
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 0.95rem;
  transition: all 0.18s cubic-bezier(0.34,1.4,0.64,1);
  line-height: 1; padding: 0;

}

}
body.ui-desktop .check-row {
  display: flex; align-items: center; gap: 8px;

  border: 1px solid var(--border);

  flex-shrink: 0;

}
body.ui-desktop .check-row input[type="checkbox"] { display: none;
}
body.ui-desktop .check-box {
  width: 17px; height: 17px;
  border: 2px solid var(--border2);
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; color: transparent;
  background: var(--surface3);

body.ui-desktop .edit-textarea {
  background: var(--surface2);
  border: 1px solid var(--border);

  border-radius: 11px;

body.ui-desktop .modal-check-row {
  display: flex; align-items: center; gap: 9px;

  background: var(--surface2);

  transition: border-color 0.2s, background 0.2s;
}
body.ui-desktop .modal-check-row:hover { border-color: var(--accent); background: var(--card-hover);
}
body.ui-desktop .modal-check-row input[type="checkbox"] { display: none;
}
body.ui-desktop .modal-check-box {
  width: 18px; height: 18px;
  border: 2px solid var(--border2);
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem; color: transparent;
  background: var(--surface3);
  transition: all 0.18s cubic-bezier(0.34,1.4,0.64,1);
  flex-shrink: 0;
}
body.ui-desktop .modal-check-row.checked .modal-check-box {
  background: var(--green);
  border-color: var(--green);

body.ui-desktop .modal-check-row.dub-check.checked .modal-check-box {

}
body.ui-desktop .modal-check-row.dub-check.checked .modal-check-lbl { color: var(--dub-color);
}
body.ui-desktop .priority-check-group { display: flex; flex-wrap: nowrap; gap: 5px; margin-bottom: 8px;
}
body.ui-desktop .priority-check-group .priority-check { flex: 1 1 0; min-width: 0; margin-bottom: 0; padding: 8px 2px; gap: 4px; justify-content: center;
}
body.ui-desktop .priority-check-group .priority-check .modal-check-box { width: 15px; height: 15px; flex-shrink: 0;
}
body.ui-desktop .priority-check-group .priority-check .modal-check-lbl { font-size: 0.74rem; white-space: nowrap;
}
body.ui-desktop .settings-toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
  padding: 9px 12px;

body.ui-desktop .settings-switch {

  width: 38px; height: 22px;

  flex-shrink: 0;
  transition: background 0.2s, border-color 0.2s;
}

  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--muted2);
  transition: transform 0.2s cubic-bezier(0.34,1.4,0.64,1), background 0.2s;
}
body.ui-desktop .settings-switch.on { background: var(--accentGlow2); border-color: var(--accent);
}
body.ui-desktop .settings-switch.on::after { transform: translateX(16px); background: var(--accent);
}
body.ui-desktop.pure-black-bg { --bg: #000000;
}
body.ui-desktop.pure-black-bg::before, body.ui-desktop.pure-black-bg::after { display: none;
}
body.ui-desktop .check-mark {
  background: rgba(0,229,160,0.12);
  border: 1px solid rgba(0,229,160,0.28);
  border-radius: 50%;
  width: 26px; height: 26px;

  color: var(--green); font-size: 0.78rem; flex-shrink: 0;
  transition: transform 0.2s, box-shadow 0.2s;
}
body.ui-desktop .completed-item:hover .check-mark {
  transform: scale(1.15);
  box-shadow: 0 0 12px rgba(0,229,160,0.5);
}
body.ui-desktop .drag-handle {

}
body.ui-desktop .drag-handle:active { cursor: grabbing;
}
body.ui-desktop .rm-poster {
  width: 40px; height: 54px;
  border-radius: 8px;

body.ui-desktop .rm-poster img { width: 100%; height: 100%; object-fit: cover; display: block;

body.ui-desktop .rm-poster-noimg { font-size: 0.9rem; color: var(--muted); opacity: 0.5;

body.ui-desktop .rm-item:hover .drag-handle, body.ui-desktop .completed-item:hover .drag-handle { opacity: 0.8; background: var(--surface3);

body.ui-desktop .search-row { display: flex; gap: 10px; align-items: center; margin-bottom: 0.6rem; flex-wrap: wrap; justify-content: center; max-width: 960px; margin-left: auto; margin-right: auto;
}
body.ui-desktop .search-row.search-row-compact .search-input { flex: 0 1 340px;
}
body.ui-desktop .search-input {
  flex: 1;
  height: 42px;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 0 22px;
  border-radius: 36px;
  font-size: 0.95rem;

  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
body.ui-desktop .search-input:focus {

body.ui-desktop .sort-select {

  border: 1px solid var(--border);

  border-radius: 36px;

body.ui-desktop .sort-select:focus { border-color: var(--accent);
}
body.ui-desktop .section-label {
  font-size: 0.66rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 0 4px;
  display: flex; align-items: center; gap: 8px;
  margin: 0.6rem 0 0.2rem;

body.ui-desktop .section-label::after {

body.ui-desktop .modal-overlay {

body.ui-desktop .drag-ghost {

body.ui-mobile #watchingBackdrop {
  /* Stile Trakt: il backdrop copre solo la parte alta con proporzioni vicine
     al 16:9 e sfuma verso il colore scuro di fondo (--bg).
     Parte da sopra il bordo fisico dello schermo (top negativo) e include
     l'area di sicurezza: così in modalità app su iPhone copre anche la zona
     sotto la Dynamic Island invece di lasciarla nera. */
  position: fixed; left: 0; right: 0;
  top: calc(-1 * env(safe-area-inset-top, 0px));
  height: min(calc(62vw + 2 * env(safe-area-inset-top, 0px)), 60vh);
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
  filter: grayscale(1) contrast(1.08);
  opacity: 0;
  transition: opacity 0.7s ease, background-image 0.3s ease;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 38%, rgba(0,0,0,0.7) 60%, rgba(0,0,0,0.3) 82%, transparent 100%);
          mask-image: linear-gradient(to bottom, #000 0%, #000 38%, rgba(0,0,0,0.7) 60%, rgba(0,0,0,0.3) 82%, transparent 100%);
}

/* =========================================================================
   CORREZIONI RESPONSIVE (file unico)
   1) Desktop — la barra laterale non deve mai allargarsi a tutta la pagina:
      la regola globale "nav { width: 100% }" (pensata per schermi piccoli)
      colpiva anche .sidebar-nav, che è un <nav>, schiacciandola sullo schermo.
   2) Mobile — la barra in basso resta compatta anche su schermi larghi.
   3) Menù impostazioni — posizionato via JS (sempre dentro lo schermo).
   ========================================================================= */

/* --- 1) DESKTOP: barra laterale sempre larga quanto i suoi pulsanti --- */
body.ui-desktop .sidebar-nav,
body.ui-desktop .mini-sidebar-nav {
  width: -moz-fit-content;
  width: fit-content;
  flex: 0 0 auto;
  order: 0;
}
body.ui-desktop .sidebar-nav { max-width: calc(100vw - 24px); }
body.ui-desktop .mini-sidebar-nav { max-width: calc(100vw - 108px); }

/* Solo con schermi molto bassi la barra diventa scrollabile al suo interno
   (in tutti gli altri casi resta senza ritagli, così i suoi bagliori si vedono). */
@media (max-height: 620px) {
  body.ui-desktop .sidebar-nav {
    max-height: calc(100vh - 16px);
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  body.ui-desktop .sidebar-nav::-webkit-scrollbar { width: 0; height: 0; display: none; }
}
body.ui-desktop .sidebar-nav > * { flex: 0 0 auto; }

/* Finché lo spazio ai lati non basta, il contenuto scorre sotto la barra
   laterale: si riserva a sinistra lo spazio che occupa (74px) così le card
   non ci finiscono mai sopra. In "Completate" la barra è doppia (mini
   sidebar Serie/Film), quindi serve più spazio. */
@media (max-width: 1270px) {
  body.ui-desktop main { padding-left: 86px; }
}
@media (max-width: 1400px) {
  body.ui-desktop.is-completate main { padding-left: 150px; }
}

/* Su schermi molto bassi la barra diventa scrollabile (già gestito sopra),
   così i pulsanti non finiscono mai fuori dallo schermo. */

/* --- 2) MOBILE: barra in basso compatta anche su schermi grandi --- */
@media (min-width: 760px) {
  body.ui-mobile .bottom-bar {
    left: 50%;
    right: auto;
    width: 100%;
    max-width: min(500px, calc(100vw - 24px));
    transform: translateX(-50%);
    padding: 0 4px;
  }
  body.ui-mobile .bottom-nav { max-width: 420px; }
  body.ui-mobile .bottom-nav .bn-btn { max-width: 88px; }
}

/* --- 3) Menù impostazioni: mai più alto dello schermo --- */
.settings-dropdown {
  max-height: calc(100vh - 16px);
  overflow-y: auto;
  overscroll-behavior: contain;
}

/* --- 4) MOBILE: le card partono sempre SOTTO i comandi fissi in alto ---
   In modalità "app web" su iPhone la barra di stato sposta verso il basso i
   pulsanti fissi (FAB sinistra, DUB/SUB centro, tema/impostazioni destra):
   se lo spazio riservato non ne tiene conto, la prima riga di card ci finisce
   sotto. --top-ui-space viene misurata via JS (syncTopUiSpace) e vale 44px
   quando non serve spazio extra, così il layout normale resta identico. */
body.ui-mobile .serie-sticky-head,
body.ui-mobile #catalog-film-subtab,
body.ui-mobile #programma .section-inline-bar {
  padding-top: var(--top-ui-space, calc(44px + env(safe-area-inset-top)));
}
/* barra di ricerca aperta: allo spazio dei comandi si aggiunge quello del campo */
body.ui-mobile #catalog-serie-subtab.search-open .serie-sticky-head,
body.ui-mobile #catalog-film-subtab.search-open {
  padding-top: calc(var(--top-ui-space, calc(44px + env(safe-area-inset-top))) + 52px);
}

</style>
</head>

<!-- ===== CATALOGO ===== -->

  <div id="catalog-serie-subtab">
    <div class="serie-sticky-head">
      <div class="search-row search-row-compact filters-hidden" id="catalogSearchRow" style="margin-bottom:0.6rem">
        <div class="catalog-view-toggle" id="catalogViewToggle">
          <button class="view-toggle-btn" id="catalogViewListBtn" onclick="toggleCatalogListMode()" title="Vista lista">☰ Liste</button>
        </div>
        <button class="filter-toggle-btn active" id="catalogFilterToggleBtn" onclick="toggleCatalogFilters()" title="Mostra/nascondi ricerca">🔍 Ricerca</button>
        <input class="search-input" type="text" placeholder="Cerca nel catalogo…" id="catalogSearch" oninput="renderCatalogDebounced()">
        <div class="ep-filter-row">
          <div class="ep-filter-wrap">
            <input class="ep-filter-input" type="number" id="epFilterInput" min="1" placeholder="EP" oninput="toggleEpClear(this,'epFilterClear');renderCatalogDebounced()">
            <button class="ep-filter-clear" id="epFilterClear" onclick="clearEpFilter()">✕</button>
          </div>
        </div>
        <select class="sort-select" id="catalogPriorityFilter" onchange="renderCatalog()" title="Filtra per priorità">
          <option value="">Tutte le priorità</option>
          <option value="molto-alta">Molto Alta</option>
          <option value="alta">Alta</option>
          <option value="normale">Normale</option>
          <option value="bassa">Bassa</option>
          <option value="molto-bassa">Molto Bassa</option>
        </select>
        <select class="sort-select" id="catalogSort" onchange="renderCatalog()">
          <option value="recent">Recenti</option>
          <option value="eps">ep ↑</option>
          <option value="title">A–Z</option>
          <option value="za">Z–A</option>
        </select>
      </div>
      <div class="stats-bar" id="catalogStats" style="margin-bottom:0.8rem;"><span class="ep-filter-badge" id="epFilterBadge"></span></div>
    </div>
    <div class="catalog-grid catalog-grid-scroll" id="catalog-grid-list-view">
      <div class="column col-dub">
        <div class="column-header">
          <div class="column-title"><span class="badge dub">DUB</span><h3>Doppiato</h3></div>
          <span class="count-badge" id="dub-count">0</span>
        </div>
        <div class="list" id="dub-list"></div>
      </div>
      <div class="column col-sub">
        <div class="column-header">
          <div class="column-title"><span class="badge sub">SUB</span><h3>Sottotitolato</h3></div>
          <span class="count-badge" id="sub-count">0</span>
        </div>
        <div class="list" id="sub-list"></div>
      </div>
    </div>
    <div class="series-cards-grid" id="catalog-cards-grid" style="display:none">

        <option value="SUB">Solo SUB</option>

// si blocca la posizione di scroll attuale e la si ripristina subito dopo.
// Perché non basta salvare window.scrollY: le voci hanno content-visibility:auto e, quando la
// lista viene ricostruita (innerHTML), le voci fuori schermo tornano all'altezza "segnaposto" del
// CSS (64px / 120px) invece di quella reale. La pagina cambia altezza di colpo e il contenuto che
// stai guardando scivola un po' su o giù. Qui si memorizzano le altezze reali PRIMA del rebuild e
// si riapplicano alle nuove voci, così l'altezza totale resta identica; poi si ripristina lo scroll

const _CV_SELECTOR = '.series-card, .item, .rm-item, .completed-item';
function _cvKey(el){ const k = el.id || el.dataset.id; return k ? el.classList[0]+'|'+k : ''; }
function _withScrollLock(fn){
  const y = window.scrollY;
  const scrolled = [];
  document.querySelectorAll('*').forEach(el=>{ if(el.scrollTop>0) scrolled.push([el, el.scrollTop]); });
  const sizes = new Map();
  document.querySelectorAll(_CV_SELECTOR).forEach(el=>{
    const k = _cvKey(el); if(!k) return;
    const h = el.getBoundingClientRect().height;
    if(!(h>0)) return;
    // contain-intrinsic-size è l'altezza del CONTENT box: tolgo padding e bordi (altrimenti ogni voce cresce)
    const cs = getComputedStyle(el);
    const extra = (parseFloat(cs.paddingTop)||0) + (parseFloat(cs.paddingBottom)||0) + (parseFloat(cs.borderTopWidth)||0) + (parseFloat(cs.borderBottomWidth)||0);
    sizes.set(k, Math.max(0, h - extra));
  });
  fn();
  document.querySelectorAll(_CV_SELECTOR).forEach(el=>{
    const h = sizes.get(_cvKey(el));
    if(h) el.style.containIntrinsicHeight = 'auto '+h.toFixed(2)+'px';
  });
  const restore = ()=>{
    if(window.scrollY!==y) window.scrollTo({top:y, left:0, behavior:'instant'});
    scrolled.forEach(([el,t])=>{ if(el.isConnected && el.scrollTop!==t) el.scrollTop = t; });
  };
  restore();
  requestAnimationFrame(restore);
}

const THEME_ORDER = ['dark','light','azure','purple','amber'];
function setTheme(theme){
  const body=document.body;
  body.classList.remove('theme-dark','theme-light','theme-azure','theme-purple','theme-amber');
  body.classList.add(`theme-${theme}`);
  localStorage.setItem('st_theme',theme);
}
function cycleTheme(){
  const current = localStorage.getItem('st_theme') || 'dark';
  const idx = THEME_ORDER.indexOf(current);
  const next = THEME_ORDER[(idx+1) % THEME_ORDER.length];
  setTheme(next);
}
function loadTheme(){
  const s=localStorage.getItem('st_theme');
  if(s&&THEME_ORDER.includes(s)) setTheme(s);
  else setTheme('dark');
}

// ---- LOCAL STORAGE & SYNC ----
function loadLocal(){
  try{
    const raw=localStorage.getItem('st_db');
    if(raw){
      const saved=JSON.parse(raw);
      // Use local if it's newer than seed
      if((saved._updatedAt||0) >= (SEED_DATA._updatedAt||0)){
        db={...db,...saved}; return;
      }
    }
    // Use seed data
    db={...db,...SEED_DATA};
    saveLocal();
  }catch(e){ db={...db,...SEED_DATA}; saveLocal(); }
}
function saveLocal(){ localStorage.setItem('st_db',JSON.stringify(db)); }
// Ripulisce eventuali doppioni: stesso id ripetuto nella stessa lista, serie ancora in "Droppate"
// pur essendo in roadmap, serie in roadmap non marcate come tali nel catalogo.
function _dedupeDb(){
  let changed=false;
  ['series','roadmap','dropped','completed'].forEach(k=>{
    const seen=new Set(); const before=(db[k]||[]).length;
    db[k]=(db[k]||[]).filter(x=>{ if(!x||seen.has(x.id)) return false; seen.add(x.id); return true; });
    if(db[k].length!==before) changed=true;
  });
  const rm=new Set(db.roadmap.map(x=>x.id));
  const dBefore=db.dropped.length;
  db.dropped=db.dropped.filter(x=>!rm.has(x.id));
  if(db.dropped.length!==dBefore) changed=true;
  db.series.forEach(x=>{ if(rm.has(x.id)&&!x.inRoadmap){ x.inRoadmap=true; changed=true; } });
  return changed;
}

// ---- SYNC FIREBASE — versione ottimizzata per il consumo dati ----
// Prima ottimizzazione (upload): invece di riscrivere sempre l'intero database
// con PUT, teniamo uno "snapshot" (serializzato) dell'ultimo stato confermato
// sincronizzato con Firebase. Ad ogni push confrontiamo il db attuale con quello
// snapshot sezione per sezione (series/roadmap/dropped/completed/...) e inviamo
// via PATCH solo le sezioni realmente cambiate: se modifichi solo la roadmap,
// non viene più ricaricata anche la lista di 150+ serie.
let _lastSyncedSnapshot = null;
function _snapshotOf(source){
  const snap = {};
  DB_TOP_KEYS.forEach(k=>{ snap[k] = JSON.stringify((source && source[k]!==undefined) ? source[k] : (k==='patternIndex'?0:[])); });
  return snap;
}
function _computeDirtyKeys(){
  if(!_lastSyncedSnapshot) return DB_TOP_KEYS.slice(); // niente snapshot noto: invia tutto (fallback sicuro)
  return DB_TOP_KEYS.filter(k=> JSON.stringify(db[k]) !== _lastSyncedSnapshot[k]);
}

async function _push(){
  setSyncState('syncing');
  try{
    const dirtyKeys = _computeDirtyKeys();
    if(dirtyKeys.length===0){
      // Nessuna sezione realmente cambiata: evitiamo del tutto la richiesta di rete.
      lastPushedAt=Date.now(); setSyncState('ok'); return true;
    }
    const body = { _updatedAt: db._updatedAt };
    dirtyKeys.forEach(k=>{ body[k]=db[k]; });
    const res=await fetch(FIREBASE_URL,{
      method:'PATCH', // PATCH invece di PUT: aggiorna solo le chiavi indicate, non l'intero nodo
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    if(!_lastSyncedSnapshot) _lastSyncedSnapshot = _snapshotOf(db);
    else dirtyKeys.forEach(k=>{ _lastSyncedSnapshot[k]=JSON.stringify(db[k]); });
    lastPushedAt=Date.now(); setSyncState('ok'); return true;
  }catch(e){ setSyncState('err',e.message); return false; }
}

// Seconda ottimizzazione (download): prima di scaricare l'intero JSON, leggiamo
// solo il campo _updatedAt (richiesta minuscola, pochi byte) e lo confrontiamo
// con quello locale. Il download completo scatta SOLO se il remoto è davvero
// più recente — nella maggior parte dei controlli periodici (nessuna modifica
// da altri dispositivi) non viene più scaricato nulla di pesante.
async function _pull(force){
  setSyncState('syncing');
  try{
    if(!force){
      const tsRes = await fetch(FIREBASE_TS_URL, { cache:'no-store' });
      if(!tsRes.ok) throw new Error('HTTP '+tsRes.status);
      const remoteTs = await tsRes.json();
      if(!(remoteTs && remoteTs > (db._updatedAt||0))){
        setSyncState('ok'); return false; // remoto non più recente: nessun download completo
      }
    }
    const res=await fetch(FIREBASE_URL, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const remote=await res.json();
    // Lo snapshot va aggiornato con ciò che è davvero salvato su Firebase in questo
    // momento, indipendentemente dal fatto che venga poi applicato al db locale:
    // serve come base per capire cosa dovremo ancora inviare in futuro.
    _lastSyncedSnapshot = _snapshotOf(remote);
    if(remote&&(remote._updatedAt||0)>(db._updatedAt||0)){
      DB_TOP_KEYS.forEach(k=>{ if(remote[k]===undefined) remote[k]=(k==='patternIndex'?0:[]); });
      db=Object.assign({},db,remote);
      if(_dedupeDb()) save();
      saveLocal(); renderAll(); toast('Sincronizzato','success');
      lastPushedAt=remote._updatedAt; setSyncState('ok'); return true;
    }
    setSyncState('ok'); return false;
  }catch(e){ setSyncState('err',e.message); return false; }
}
function syncPush(){ syncQueue=syncQueue.then(()=>_push()).catch(()=>setSyncState('err','push failed')); }
function syncPull(force){ syncQueue=syncQueue.then(()=>_pull(force)).catch(()=>setSyncState('err','pull failed')); }
async function manualSync(){ syncQueue=syncQueue.then(async()=>{ const p=await _pull(true); if(!p) await _push(); }).catch(()=>setSyncState('err','sync failed')); }
let _syncIconTimer = null;
function setSyncState(state, _msg){
  const dot=document.getElementById('syncDot'),btn=document.getElementById('syncBtn'),icon=document.getElementById('syncIcon');
  if(!dot||!btn||!icon) return;
  dot.className='sync-dot'+(state?' '+state:'');
  if(state==='syncing'){
    btn.classList.add('syncing');
    if(_syncIconTimer){ clearTimeout(_syncIconTimer); _syncIconTimer=null; }
  } else {
    btn.classList.remove('syncing');
    if(state==='ok'){
      icon.textContent='✓';
      if(_syncIconTimer) clearTimeout(_syncIconTimer);
      _syncIconTimer=setTimeout(()=>{ icon.textContent='⟳'; _syncIconTimer=null; },1800);
    } else if(state==='err'){
      icon.textContent='⟳';
    }
  }
}
// Intervallo aumentato da 30s a 60s e, soprattutto, il controllo viene saltato
// del tutto quando la scheda è in background (non visibile): non ha senso
// consumare dati per sincronizzare una pagina che l'utente non sta guardando.
function startSyncPoll(){
  if(syncTimer) clearInterval(syncTimer);
  syncTimer=setInterval(()=>{
    if(document.hidden) return;
    if(db._updatedAt>lastPushedAt) syncPush(); else syncPull();
  },60000);
}
// Quando la scheda torna in primo piano dopo essere stata nascosta, facciamo
// un solo controllo leggero (non un fetch completo forzato) per recuperare
// eventuali modifiche fatte nel frattempo da un altro dispositivo.
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){
    if(db._updatedAt>lastPushedAt) syncPush(); else syncPull();
  }
});
function save(){ db._updatedAt=Date.now(); saveLocal(); clearTimeout(window._saveDebounce); window._saveDebounce=setTimeout(syncPush,1200); }
function toast(msg,type='info'){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+type; clearTimeout(window._toastTimer); window._toastTimer=setTimeout(()=>t.classList.remove('show'),2800); }

// ---- RICERCA AUTOMATICA CODICE IMDB (via OMDb API) ----
// IMDB stesso non permette richieste dirette dal browser (nessun header CORS),
// e i proxy CORS gratuiti sono inaffidabili/limitati. OMDb API è pensata invece
// per essere chiamata direttamente dal browser e restituisce l'ID IMDB (imdbID)
// già pronto nei risultati di ricerca. Serve una chiave gratuita, richiesta una
// sola volta e salvata nel browser: https://www.omdbapi.com/apikey.aspx
let _imdbSearchTimer = null;
let _imdbSearchAbort = null;
const _imdbSearchCache = new Map(); // query -> risultato, evita richieste di rete ripetute
const _OMDB_FIXED_API_KEY = 'df0673f0';
function _getOmdbApiKey(){ return _OMDB_FIXED_API_KEY; }
function handleImdbTitleInput(inputEl, resultsId, imdbFieldId, mediaType, titleFieldId){
  const resultsEl = document.getElementById(resultsId);
  if(!resultsEl) return;
  clearTimeout(_imdbSearchTimer);
  const q = inputEl.value.trim();
  if(q.length < 2){ resultsEl.classList.remove('open'); resultsEl.innerHTML=''; return; }
  if(!_getOmdbApiKey()){ _renderOmdbKeyPrompt(resultsEl, resultsId, imdbFieldId, mediaType, titleFieldId); return; }
  _imdbSearchTimer = setTimeout(()=>_runImdbSearch(q, resultsEl, imdbFieldId, mediaType, titleFieldId), 350);
}
function _renderOmdbKeyPrompt(resultsEl, resultsId, imdbFieldId, mediaType, titleFieldId){
  resultsEl.classList.add('open');
  resultsEl.innerHTML = `
    <div class="imdb-search-status" style="text-align:left;line-height:1.5;">
      Per cercare automaticamente il codice IMDB serve una chiave gratuita OMDb (email, attivazione immediata).
      <a href="https://www.omdbapi.com/apikey.aspx" target="_blank" rel="noopener" style="color:var(--accent2);">Ottienila qui</a>, poi incollala sotto:
      <div style="display:flex;gap:6px;margin-top:8px;">
        <input class="edit-field" id="_omdbKeyInput" placeholder="Incolla qui la chiave API" style="margin:0;flex:1;font-size:0.78rem;padding:8px 10px;" autocomplete="off">
        <button class="edit-save-btn" style="flex-shrink:0;padding:8px 12px;font-size:0.78rem;" onclick="_saveOmdbApiKey('${resultsId}','${imdbFieldId}','${mediaType}','${titleFieldId}')">Salva</button>
      </div>
    </div>`;
  setTimeout(()=>{ const i=document.getElementById('_omdbKeyInput'); if(i){ i.focus(); i.addEventListener('keydown', e=>{ if(e.key==='Enter') _saveOmdbApiKey(resultsId, imdbFieldId, mediaType, titleFieldId); }); } }, 30);
}
function _saveOmdbApiKey(resultsId, imdbFieldId, mediaType, titleFieldId){
  const input = document.getElementById('_omdbKeyInput');
  const key = input ? input.value.trim() : '';
  if(!key){ toast('Inserisci una chiave valida','error'); return; }
  localStorage.setItem('st_omdbApiKey', key);
  toast('Chiave OMDb salvata','success');
  const resultsEl = document.getElementById(resultsId);
  const titleEl = document.getElementById(titleFieldId);
  const q = titleEl ? titleEl.value.trim() : '';
  if(q.length >= 2 && resultsEl){ _runImdbSearch(q, resultsEl, imdbFieldId, mediaType, titleFieldId); }
  else if(resultsEl){ resultsEl.classList.remove('open'); resultsEl.innerHTML=''; }
}
async function _runImdbSearch(q, resultsEl, imdbFieldId, mediaType, titleFieldId){
  resultsEl.classList.add('open');
  const cacheKey = mediaType+'::'+q.trim().toLowerCase();
  if(_imdbSearchCache.has(cacheKey)){
    _renderImdbResults(_imdbSearchCache.get(cacheKey), resultsEl, imdbFieldId, titleFieldId);
    return;
  }
  resultsEl.innerHTML = `<div class="imdb-search-status">Cerco su IMDB…</div>`;
  try{
    if(_imdbSearchAbort) _imdbSearchAbort.abort();
    _imdbSearchAbort = new AbortController();
    const key = _getOmdbApiKey();
    const typeParam = mediaType ? `&type=${encodeURIComponent(mediaType)}` : '';
    const url = `https://www.omdbapi.com/?apikey=${encodeURIComponent(key)}&s=${encodeURIComponent(q.trim())}${typeParam}`;
    const res = await fetch(url, { signal: _imdbSearchAbort.signal });
    if(!res.ok) throw new Error('http '+res.status);
    const data = await res.json();
    if(data.Response === 'False'){
      if(/invalid api key/i.test(data.Error||'')){
        resultsEl.innerHTML = `<div class="imdb-search-status">Chiave OMDb non valida</div>`;
        toast('Chiave OMDb non valida','error');
        return;
      }
      _imdbSearchCache.set(cacheKey, []);
      resultsEl.innerHTML = `<div class="imdb-search-status">Nessun risultato su IMDB</div>`;
      return;
    }
    const items = data.Search||[];
    _imdbSearchCache.set(cacheKey, items);
    _renderImdbResults(items, resultsEl, imdbFieldId, titleFieldId);
  }catch(err){
    if(err.name === 'AbortError') return;
    resultsEl.innerHTML = `<div class="imdb-search-status">Ricerca non disponibile (nessuna connessione). Inserisci il codice manualmente.</div>`;
  }
}
function _renderImdbResults(items, resultsEl, imdbFieldId, titleFieldId){
    if(!items.length){
      resultsEl.innerHTML = `<div class="imdb-search-status">Nessun risultato su IMDB</div>`;
      return;
    }
    const shown = items.slice(0,8);
    resultsEl.innerHTML = shown.map(it=>{
      const poster = it.Poster && it.Poster!=='N/A' ? it.Poster : '';
      const year = it.Year || '';
      const typeLbl = it.Type==='movie' ? 'Film' : (it.Type==='series' ? 'Serie TV' : (it.Type==='episode' ? 'Episodio' : (it.Type||'')));
      const safeTitle = (it.Title||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return `<div class="imdb-search-item" data-id="${it.imdbID}">
        ${poster ? `<img src="${poster}" alt="" loading="lazy" decoding="async">` : `<div class="isi-ph"></div>`}
        <div class="isi-info">
          <div class="isi-title">${safeTitle}</div>
          <div class="isi-meta">${[typeLbl, year, it.imdbID].filter(Boolean).join(' · ')}</div>
        </div>
      </div>`;
    }).join('');
    resultsEl.querySelectorAll('.imdb-search-item').forEach((el, idx)=>{
      const it = shown[idx];
      el.addEventListener('click', ()=>{
        const field = document.getElementById(imdbFieldId);
        if(field) field.value = it.imdbID;
        const titleField = titleFieldId ? document.getElementById(titleFieldId) : null;
        if(titleField) titleField.value = it.Title || '';
        resultsEl.classList.remove('open');
        resultsEl.innerHTML = '';
        toast('Codice IMDB trovato: '+it.imdbID, 'success');
      });
    });
}

// ---- GLOBAL KEYBOARD HANDLER ----
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(document.getElementById('addSeriesModal').classList.contains('open')){ closeAddSeriesModal(); return; }
    if(document.getElementById('addFilmModal').classList.contains('open')){ closeAddFilmModal(); return; }
    if(document.getElementById('editFilmModal').classList.contains('open')){ closeEditFilmModal(); return; }
    if(document.getElementById('editSeriesModal').classList.contains('open')){ closeEditModal(); return; }
    if(document.getElementById('filmSeriesModal').classList.contains('open')){ closeFilmSeriesModal(); return; }
    if(document.getElementById('importModal').classList.contains('open')){ closeImportModal(); return; }
    if(document.getElementById('franchiseFilmsOverlay').classList.contains('open')){ closeAnimeFranchiseModal(); return; }
    closeSettingsMenu();
  }
  if(e.key === 'n' || e.key === 'N'){
    const anyModalOpen = ['addSeriesModal','addFilmModal','editFilmModal','editSeriesModal','filmSeriesModal','importModal'].some(id=>document.getElementById(id).classList.contains('open'));
    const tag = e.target.tagName;
    const isInput = tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
    if(!anyModalOpen && !isInput){
      e.preventDefault();
      const active = document.querySelector('.section.active');
      if(active){
        if(active.id==='catalogo'){
          const filmSubtab = document.getElementById('catalog-film-subtab');
          if(filmSubtab && filmSubtab.style.display !== 'none'){ openAddFilmModal(); }
          else { openAddSeriesModal(); }
          return;
        }
      }
    }
  }
  if(e.key === 'Enter'){
    const tag = e.target.tagName;
    const isTextarea = tag === 'TEXTAREA';
    if(document.getElementById('addSeriesModal').classList.contains('open') && !isTextarea){ e.preventDefault(); addSeries(); return; }
    if(document.getElementById('addFilmModal').classList.contains('open') && !isTextarea){ e.preventDefault(); addFilm(); return; }
    if(document.getElementById('editFilmModal').classList.contains('open') && !isTextarea){ e.preventDefault(); saveEditFilm(); return; }
    if(document.getElementById('editSeriesModal').classList.contains('open') && !isTextarea){ e.preventDefault(); saveEditModal(); return; }
    if(document.getElementById('filmSeriesModal').classList.contains('open') && !isTextarea){ e.preventDefault(); saveFilmSeries(); return; }
  }
});

  html += `<div class="sd-stat"><div class="sd-stat-label">Tipo</div><div class="sd-stat-value">${s.type}</div></div>`;

    html += `<div class="sd-notes">${s.notes.replace(/</g,'&lt;')}</div>`;
    html += '</div>';
  }

  // Linked films — direct id match (anime saga) + fuzzy title match (film saga)
  const allFilms = [...(db.films||[]), ...(db.filmsCompleted||[])];
  const completedFilmIds = new Set((db.filmsCompleted||[]).map(f=>f.id));
  const linked = allFilms.filter(f=>{
    if(!f.seriesId) return false;
    if(f.seriesId === s.id) return true;

  }).sort((a,b)=>(a.seriesOrder||99)-(b.seriesOrder||99));

  if(linked.length){

    });

  document.getElementById('sdFooter').innerHTML =

function setSdPoster(rec){
  const el = document.getElementById('sdPoster');
  if(!el) return;
  let src = (rec && rec.image) ? rec.image : '';
  if(!src && rec && rec.imdbId) src = imdbPosterUrl(rec.imdbId);
  if(!src && rec && rec.id){
    const ref = (db.series||[]).find(x=>x.id===rec.id);
    if(ref) src = ref.image || imdbPosterUrl(ref.imdbId);
  }
  if(!src){
    el.classList.remove('show');
    el.innerHTML = '';
    return;

  el.innerHTML = `<img src="${escAttr(src)}" alt="${escAttr(rec.title||'')}" onerror="this.onerror=null;this.parentElement.classList.remove('show');this.parentElement.innerHTML='';">`;
  el.classList.add('show');
}

/* =========================================================================
   BACKDROP NELLE VOCI ROADMAP + SFONDO PAGINA (stile Trakt)
   -------------------------------------------------------------------------
   Nota: OMDb non restituisce backdrop, solo il poster verticale. Con una
   chiave TMDb (gratuita) si risolve il vero backdrop 16:9 dall'id IMDB già
   presente su ogni voce; senza chiave si usa il poster stesso come texture
   di sfondo, sfocato e attenuato.
   ========================================================================= */
function _getTmdbKey(){ return (localStorage.getItem('st_tmdbApiKey')||'').trim(); }
function backdropsEnabled(){ const v=localStorage.getItem('st_backdropsOn'); return v===null ? true : v==='1'; }

let _bdCache = {};
try { _bdCache = JSON.parse(localStorage.getItem('st_bdCache_v2')||'{}') || {}; } catch(e){ _bdCache = {}; }
function _bdCacheSave(){ try { localStorage.setItem('st_bdCache_v2', JSON.stringify(_bdCache)); } catch(e){} }
const _bdPending = {};

function resolveBackdrop(imdbId){
  const id = String(imdbId||'').trim();
  if(!id) return Promise.resolve(null);
  const key = _getTmdbKey();
  if(!key){
    const poster = imdbPosterUrl(id);
    return Promise.resolve(poster ? { url: poster, fallback: true } : null);
  }
  if(Object.prototype.hasOwnProperty.call(_bdCache, id)){
    const v = _bdCache[id];
    return Promise.resolve(v ? { url: v, fallback: false } : { url: imdbPosterUrl(id), fallback: true });
  }
  if(_bdPending[id]) return _bdPending[id];
  const url = `https://api.themoviedb.org/3/find/${encodeURIComponent(id)}?api_key=${encodeURIComponent(key)}&external_source=imdb_id`;
  _bdPending[id] = fetch(url)
    .then(r=>r.json())
    .then(d=>{
      const hit = (d.movie_results&&d.movie_results[0]) || (d.tv_results&&d.tv_results[0]) || null;
      const path = hit && hit.backdrop_path ? hit.backdrop_path : '';
      _bdCache[id] = path ? `https://image.tmdb.org/t/p/w1280${path}` : '';
      _bdCacheSave();
      return _bdCache[id] ? { url:_bdCache[id], fallback:false } : { url: imdbPosterUrl(id), fallback:true };
    })
    .catch(()=>({ url: imdbPosterUrl(id), fallback:true }))
    .finally(()=>{ delete _bdPending[id]; });
  return _bdPending[id];
}

function _paintBackdrop(el, imdbId){
  el.dataset.bdDone = '1';
  if(!backdropsEnabled() || !imdbId) return;
  resolveBackdrop(imdbId).then(res=>{
    if(!res || !res.url) return;
    const pre = new Image();
    pre.onload = ()=>{
      el.style.backgroundImage = `url("${res.url}")`;
      el.classList.toggle('fallback', !!res.fallback);
      el.classList.add('loaded');
    };
    pre.src = res.url;
  });
}

function applyCardBackdrops(){
  document.querySelectorAll('.scb-backdrop:not([data-bd-done]), .rm-backdrop:not([data-bd-done])').forEach(el=>{
    _paintBackdrop(el, el.getAttribute('data-bd'));
  });
}

// Sfondo pagina = backdrop (in bianco e nero) della voce in visione più avanti
// in percentuale (episodi visti / totale) tra TUTTE quelle con stato "watching".
// Nota: l'immagine può non essere sulla voce di roadmap (viene salvata sulla
// serie in catalogo), quindi la si recupera anche da db.series/db.completed.
function _artworkFor(r){
  let imdbId = String((r && r.imdbId) || '').trim();
  let image  = String((r && r.image)  || '').trim();
  if((!imdbId || !image) && r && r.id){
    const ref = ((typeof db!=='undefined' && db.series)||[]).find(s=>s.id===r.id)
             || ((typeof db!=='undefined' && db.completed)||[]).find(s=>s.id===r.id)
             || ((typeof db!=='undefined' && db.dropped)||[]).find(s=>s.id===r.id);
    if(ref){
      if(!imdbId) imdbId = String(ref.imdbId||'').trim();
      if(!image)  image  = String(ref.image ||'').trim();
    }
  }
  if(!image && imdbId) image = imdbPosterUrl(imdbId);
  return { imdbId, image };
}

let _wbToken = 0;
function updateWatchingBackdrop(){
  const layer = document.getElementById('watchingBackdrop');
  if(!layer) return;
  const clear = ()=>{ layer.classList.remove('on'); layer.style.backgroundImage=''; delete layer.dataset.forId; };
  if(!backdropsEnabled()){ clear(); return; }

  // 1) tutte le voci in visione con una qualsiasi immagine utilizzabile
  const candidates = ((typeof db!=='undefined' && db.roadmap)||[])
    .map((r,i)=>{
      const eps = Number(r && r.eps) || 0;
      const cur = Number(r && r.currentEp) || 0;
      return { r, i, pct: eps>0 ? cur/eps : 0, art: _artworkFor(r) };
    })
    .filter(o => o.r && o.r.status==='watching' && (o.art.imdbId || o.art.image));

  if(!candidates.length){ clear(); return; }

  // 2) vince la serie il cui episodio è avanzato per ultimo (lastEpAt più recente).
  //    Per le voci senza timestamp (dati precedenti) si ripiega sulla percentuale,
  //    poi sulla posizione in lista.
  candidates.sort((a,b)=> ((b.r.lastEpAt||0) - (a.r.lastEpAt||0)) || (b.pct - a.pct) || (a.i - b.i));

  const winner = candidates[0];
  const winnerId = String(winner.r.id || winner.i);
  // già dipinto per questa voce? non rifare nulla (ma se il layer non è attivo, riprova)
  if(layer.dataset.forId === winnerId && layer.classList.contains('on')) return;
  layer.dataset.forId = winnerId;

  // 3) prova il vincitore; se la sua immagine non si carica, passa al successivo
  const token = ++_wbToken;
  const tryCandidate = (n)=>{
    if(token !== _wbToken) return;           // una passata più recente ha già preso il controllo
    if(n >= candidates.length){ if(token===_wbToken){ layer.classList.remove('on'); layer.style.backgroundImage=''; } return; }
    const c = candidates[n];
    Promise.resolve(resolveBackdrop(c.art.imdbId)).then(res=>{
      if(token !== _wbToken) return;
      const url = (res && res.url) || c.art.image || '';
      if(!url){ tryCandidate(n+1); return; }
      const pre = new Image();
      pre.onload = ()=>{
        if(token !== _wbToken) return;
        layer.dataset.forId = String(c.r.id || c.i);
        layer.style.backgroundImage = `url("${url}")`;
        layer.classList.add('on');
      };
      pre.onerror = ()=>{ tryCandidate(n+1); };
      pre.src = url;
    }).catch(()=>tryCandidate(n+1));
  };
  tryCandidate(0);
}

let _bdTimer = null;
function scheduleBackdropPass(){
  clearTimeout(_bdTimer);
  _bdTimer = setTimeout(()=>{
    const run = ()=>{ applyCardBackdrops(); updateWatchingBackdrop(); };
    if(window.requestIdleCallback) requestIdleCallback(run, {timeout:800}); else run();
  }, 200);
}
// I render sono sparsi in molte funzioni: un observer copre tutti i casi
// (roadmap, catalogo, ecc.) senza doverli agganciare uno per uno.
document.addEventListener('DOMContentLoaded', ()=>{
  scheduleBackdropPass();
  const mo = new MutationObserver(scheduleBackdropPass);
  mo.observe(document.body, { childList:true, subtree:true });
});

  rec = db.roadmap.find(x=>x.id===id);
  if(rec) return {rec, list:'roadmap'};
  rec = db.completed.find(x=>x.id===id);
  if(rec) return {rec, list:'completed'};
  rec = db.dropped.find(x=>x.id===id);
  if(rec) return {rec, list:'dropped'};
  return null;
}

    s.title=newTitle; s.eps=newEps; s.films=newFilms; s.type=newType; s.imdbId=newImdbId; s.image=newImage; s.notes=newNotes; s.ongoing=_editOngoing; s.priority=_editPriority;

    [db.series,db.roadmap,db.dropped,db.completed].forEach(arr=>{ const r=arr.find(x=>x.id===id); if(r && r!==s){ r.title=newTitle; r.eps=newEps; r.type=newType; r.imdbId=newImdbId; r.image=newImage; } });
    save();

    if(found.list==='series') renderCatalog();

    else if(found.list==='dropped') renderDropped();

    if(found.list!=='roadmap' && db.roadmap.find(x=>x.id===id)) renderRoadmap();

function addRandom(forceType){
  const required=forceType||PATTERN[db.patternIndex];
  const pool=db.series.filter(s=>!s.inRoadmap&&s.type===required);
  if(!pool.length){ toast(`Nessuna serie ${required} disponibile`,'error'); return; }
  const weights=pool.map(s=>s.favorite?3:1);
  const total=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total, picked=pool[pool.length-1];
  for(let i=0;i<pool.length;i++){ r-=weights[i]; if(r<=0){picked=pool[i];break;} }
  picked.inRoadmap=true;
  db.roadmap.push({id:picked.id,title:picked.title,eps:picked.eps,type:picked.type,films:picked.films||0,imdbId:picked.imdbId||'',image:picked.image||'',notes:picked.notes||'',ongoing:!!picked.ongoing,priority:picked.priority||'normale',status:'normal',currentEp:0,addedAt:picked.addedAt});
  if(!forceType) db.patternIndex=(db.patternIndex+1)%PATTERN.length;
  save();
  renderCatalog();
  renderRoadmap();
  toast(`${picked.favorite?'★ ':''}Aggiunto: ${picked.title}`,'success');
}

function buildRmItemHTML(r, i){
  const pct=Math.round((r.currentEp||0)/r.eps*100);
  // Le note "vere" vivono sulla scheda serie in db.series (stessa fonte usata dalla roadmap stessa)
  const _srcSeries = db.series.find(x=>x.id===r.id);
  const _notes = _srcSeries?.notes || r.notes || '';
  const notesTooltip = _notes ? `<div class="rm-notes-wrap"><span class="rm-notes-badge" data-tooltip="${_notes.replace(/"/g,'&quot;').replace(/</g,'&lt;')}" onmouseenter="showRmTooltip(this)" onmouseleave="hideRmTooltip()">NOTE</span></div>` : '';
  const _filmsCount = _srcSeries?.films || 0;
  let filmsTag = '';
  if(_filmsCount > 0){
    const allFilms = [...(db.films||[]), ...(db.filmsCompleted||[])];
    const allSeriesMap2 = {};
    (db.filmSeries||[]).forEach(s=>{ allSeriesMap2[s.id]=s; });
    const seriesTitleNorm = _normalizeTitleForMatch(_srcSeries?.title||'');
    let matchedFilms = allFilms.filter(f=>{
      if(!f.seriesId) return false;
      const saga = allSeriesMap2[f.seriesId];
      if(!saga) return false;
      return _normalizeTitleForMatch(saga.title) === seriesTitleNorm;
    });
    if(!matchedFilms.length) matchedFilms = allFilms.filter(f=>f.seriesId===r.id);
    matchedFilms.sort((a,b)=>(a.seriesOrder||999)-(b.seriesOrder||999));
    const completedIds = new Set((db.filmsCompleted||[]).map(f=>f.id));
    const filmListStr = matchedFilms.length
      ? matchedFilms.map((f,i)=>`${completedIds.has(f.id)?'✓':' '} ${getOrdinal(i+1)} ${f.title}`).join('\n')
      : `${_filmsCount} film associati`;
    const tooltipText = filmListStr.replace(/"/g,'&quot;').replace(/</g,'&lt;');
    filmsTag = ` · <span class="rm-notes-badge" data-tooltip="${tooltipText}" onmouseenter="showRmTooltip(this)" onmouseleave="hideRmTooltip()">${_filmsCount} FILM</span>`;
  }
  const _image = _srcSeries?.image || '';
  const posterHtml = _image
    ? `<div class="rm-poster"><img src="${escAttr(_image)}" alt="" loading="lazy" decoding="async" onerror="this.onerror=null;this.parentElement.innerHTML='<span class=&quot;rm-poster-noimg&quot;>🎬</span>';"></div>`
    : `<div class="rm-poster"><span class="rm-poster-noimg">🎬</span></div>`;
  const _linkedFilmsForAlert = (db.films||[]).filter(f=>f.seriesId===r.id).length;
  const hasAlertEntry = r.status==='watching' && (!!_notes || _linkedFilmsForAlert>0);
  const alertBadge = hasAlertEntry ? `<span class="rm-alert-linked-badge" title="Presente nel pannello Da ricordare">🔔</span>` : '';
  // Blocco episodio: stepper completo su desktop, display compatto su mobile
  const epBlock = r.status!=='watching' ? '' : (IS_MOBILE
    ? `<div class="rm-ep-wrap"><div class="rm-ep-display">${r.currentEp||0}/${r.eps} • ${pct}%</div></div>`
    : `<div class="watching-tag">watching</div><div class="ep-stepper"><button class="step-btn" onclick="stepEp('${r.id}',-1)" title="Episodio precedente">‹</button><span class="ep-count"><input class="ep-input" type="number" min="0" max="${r.eps}" value="${r.currentEp||0}" onchange="updateEp('${r.id}',this.value)"><span class="ep-total">/${r.eps}</span></span><button class="step-btn" onclick="stepEp('${r.id}',1)" title="Episodio successivo">›</button><span class="ep-pct">${pct}%</span></div>`);
  return `<div class="rm-item ${r.status==='watching'?'watching':''} ${hasAlertEntry?'has-alert-link':''}" data-id="${r.id}" style="animation:itemIn .22s ${staggerDelay(i,0.04,0.3)}s both;cursor:pointer;" onclick="handleRmItemClick(event,'${r.id}')">
    <div class="rm-backdrop" data-bd="${escAttr(r.imdbId||_srcSeries?.imdbId||'')}"></div>
    ${posterHtml}
    <div class="drag-handle">⠿</div>
    <div class="rm-num">${String(i+1).padStart(2,'0')}</div>
    <div class="rm-info">
      <div class="rm-name">${r.title}${alertBadge}</div>
      <div class="rm-meta">${r.eps} ep${filmsTag}${_notes ? ' · ' : ''}${notesTooltip}</div>
    </div>
    ${epBlock}
    <span class="badge ${r.type.toLowerCase()}">${r.type}</span>
    <div class="reorder-btns">
      <button class="reorder-btn" onclick="reorderEntry(db.roadmap,'${r.id}',-1,renderRoadmap)" title="Su">▲</button>
      <button class="reorder-btn" onclick="reorderEntry(db.roadmap,'${r.id}',1,renderRoadmap)" title="Giù">▼</button>
    </div>
    ${r.status==='watching'?`<div class="progress-bottom"><div class="progress-bottom-fill" style="width:${pct}%"></div></div>`:''}
  </div>`;
}

  const _prevEp=item.currentEp||0;
  item.currentEp=Math.min(item.eps,Math.max(0,parseInt(val)||0));
  if(item.currentEp>_prevEp) item.lastEpAt=Date.now();   // l'episodio è andato avanti
  save();
  syncEpUI(id,item);

function dropEntry(id){
  const idx=db.roadmap.findIndex(r=>r.id===id);
  if(idx===-1) return;
  const item=db.roadmap.splice(idx,1)[0];
  const _src=db.series.find(s=>s.id===item.id);
  if(_src && _src.notes) item.notes=_src.notes; // porta con sé l'ultima nota salvata
  db.dropped=db.dropped.filter(r=>r.id!==item.id);
  db.dropped.push(item);
  db.series=db.series.filter(s=>s.id!==item.id);
  save(); renderRoadmap(); renderDropped(); toast(`Droppato: ${item.title} (ora in Completate)`,'info');
}

function backToRoadmap_fromCompleted(id){

  db.roadmap=db.roadmap.filter(r=>r.id!==item.id); db.series.forEach(s=>{ if(s.id===item.id) s.inRoadmap=true; });

// ---- UTIL: REORDER & STEP ----
function reorderEntry(arr,id,dir,renderFn){
  const idx=arr.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=arr.length) return;
  [arr[idx],arr[newIdx]]=[arr[newIdx],arr[idx]];
  if(arr===db.roadmap && roadmapReorderMode){
    // In modalità riordino: sposta solo il nodo DOM e rinumera, niente save/re-render
    const container=document.getElementById('roadmap');
    if(container){
      const items=[...container.querySelectorAll('.rm-item')];
      const elA=items[idx], elB=items[newIdx];
      if(elA && elB){
        if(dir<0) container.insertBefore(elA, elB);
        else container.insertBefore(elB, elA);
      }
      renumberRmItems(container);
    }
    return;
  }
  save(); renderFn();
}
function renumberRmItems(container){
  container.querySelectorAll('.rm-item').forEach((el,i)=>{
    const numEl=el.querySelector('.rm-num');
    if(numEl) numEl.textContent=String(i+1).padStart(2,'0');
  });
}

let roadmapReorderMode = false;
let _roadmapReorderSnapshot = null;
function toggleRoadmapReorderMode(){
  if(roadmapReorderMode) return;
  roadmapReorderMode = true;
  _roadmapReorderSnapshot = db.roadmap.map(r=>r.id);
  const el=document.getElementById('roadmap');
  if(el) el.classList.add('reorder-mode');

function confirmRoadmapReorder(){
  roadmapReorderMode = false;
  _roadmapReorderSnapshot = null;
  const el=document.getElementById('roadmap');
  if(el) el.classList.remove('reorder-mode');
  save();
  renderRoadmapReorderBar();
  renderRoadmap();
  toast('Ordine aggiornato ✓','success');

function cancelRoadmapReorder(){
  if(_roadmapReorderSnapshot){
    const map={}; db.roadmap.forEach(r=>{ map[r.id]=r; });
    const restored=_roadmapReorderSnapshot.map(id=>map[id]).filter(Boolean);
    if(restored.length===db.roadmap.length) db.roadmap.splice(0,db.roadmap.length,...restored);
  }
  roadmapReorderMode = false;
  _roadmapReorderSnapshot = null;
  const el=document.getElementById('roadmap');

function stepEp(id,delta){
  const item=db.roadmap.find(r=>r.id===id);
  if(!item) return;
  const _prevEp=item.currentEp||0;
  item.currentEp=Math.min(item.eps,Math.max(0,_prevEp+delta));
  if(item.currentEp>_prevEp) item.lastEpAt=Date.now();   // l'episodio è andato avanti
  save();
  syncEpUI(id,item);
}

function renderRoadmapAlerts(){
  const col = document.getElementById('roadmapAlertCol');
  const layout = document.getElementById('programmaLayout');
  if(!col || !layout) return;
  const watching = (db.roadmap||[]).filter(r=>r.status==='watching');
  const items = watching.map(r=>{
    // Le note "vere" vivono sulla scheda serie in db.series (stessa fonte usata dalla
    // roadmap stessa): qui bisogna leggere da lì, non dal campo notes della voce
    // roadmap che può restare non aggiornato.
    const _srcSeries = db.series.find(x=>x.id===r.id);
    const notes = (_srcSeries?.notes || r.notes || '').trim();
    const hasNotes = !!notes;
    const linkedFilms = (db.films||[]).filter(f=>f.seriesId===r.id);
    if(!hasNotes && !linkedFilms.length) return null;
    return { r, notes, hasNotes, linkedFilms };
  }).filter(Boolean);

  if(!items.length){
    col.innerHTML = '';
    col.classList.remove('visible');
    layout.classList.remove('has-alerts');
    return;
  }
  col.classList.add('visible');
  layout.classList.add('has-alerts');

  const MAX_FILMS_SHOWN = 3;
  const cards = items.map(({r,notes,hasNotes,linkedFilms})=>{
    const notesHtml = hasNotes ? `<div class="rm-alert-note">🗒 ${notes.replace(/</g,'&lt;')}</div>` : '';
    let filmsHtml = '';
    if(linkedFilms.length){
      const shown = linkedFilms.slice(0, MAX_FILMS_SHOWN);
      const extra = linkedFilms.length - shown.length;
      filmsHtml = `<div class="rm-alert-films">
        ${shown.map(f=>`<span class="rm-alert-film">${f.title}</span>`).join('')}
        ${extra>0 ? `<span class="rm-alert-films-more">+${extra} altri</span>` : ''}
      </div>`;
    }
    return `<div class="rm-alert-card" data-id="${r.id}" onclick="openRoadmapDetail('${r.id}')">
      <div class="rm-alert-card-title"><span class="badge ${r.type.toLowerCase()}">${r.type}</span><span>${r.title}</span></div>
      ${notesHtml}
      ${filmsHtml}
    </div>`;
  }).join('');

  col.innerHTML = `<div class="rm-alert-panel">
    <div class="rm-alert-panel-title">🔔 Da ricordare</div>
    ${cards}
  </div>`;
}
